name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/outboxrelay --output-dir /tmp/outboxrelay-demo
      - run: test -f /tmp/outboxrelay-demo/manifest.json
